name: Generate first-person glove assets

on:
  workflow_dispatch:
  push:
    branches: [feature/first-person-glove-assets]
    paths:
      - tools/blender/generate_first_person_gloves.py
      - .github/workflows/generate-first-person-gloves.yml

permissions:
  contents: write

jobs:
  build-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends blender python3-numpy

      - name: Generate desktop glove viewmodel
        run: |
          blender --background \
            --python tools/blender/generate_first_person_gloves.py -- \
            --output apps/game-lite/assets/production/first-person-gloves.glb

      - name: Generate mobile glove viewmodel
        run: |
          blender --background \
            --python tools/blender/generate_first_person_gloves.py -- \
            --output apps/game-lite/assets/production/first-person-gloves-mobile.glb \
            --mobile

      - name: Validate generated GLBs
        run: |
          python3 tools/validate_glb.py \
            apps/game-lite/assets/production/first-person-gloves.glb \
            apps/game-lite/assets/production/first-person-gloves-mobile.glb

      - name: Inspect generated files
        run: |
          ls -lh apps/game-lite/assets/production/first-person-gloves*.glb
          test -s apps/game-lite/assets/production/first-person-gloves.glb
          test -s apps/game-lite/assets/production/first-person-gloves-mobile.glb

      - name: Commit generated GLBs
        run: |
          git config user.name "riskmulate-asset-bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps/game-lite/assets/production/first-person-gloves.glb \
                  apps/game-lite/assets/production/first-person-gloves-mobile.glb
          if git diff --cached --quiet; then
            echo "Generated assets are unchanged."
            exit 0
          fi
          git commit -m "Generate animated first-person glove GLBs"
          git push origin "HEAD:${GITHUB_REF_NAME}"
