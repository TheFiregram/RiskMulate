name: Generate process tank assets

on:
  workflow_dispatch:
  push:
    branches: [feature/process-tank-assets]
    paths:
      - tools/blender/generate_process_tanks.py
      - .github/workflows/generate-process-tanks.yml

permissions:
  contents: write

jobs:
  build-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends blender

      - name: Generate desktop tank cluster
        run: |
          blender --background \
            --python tools/blender/generate_process_tanks.py -- \
            --output apps/game-lite/assets/production/process-tanks.glb

      - name: Generate mobile tank cluster
        run: |
          blender --background \
            --python tools/blender/generate_process_tanks.py -- \
            --output apps/game-lite/assets/production/process-tanks-mobile.glb \
            --mobile

      - name: Inspect generated files
        run: |
          ls -lh apps/game-lite/assets/production/process-tanks*.glb
          test -s apps/game-lite/assets/production/process-tanks.glb
          test -s apps/game-lite/assets/production/process-tanks-mobile.glb

      - name: Commit generated GLBs
        run: |
          git config user.name "riskmulate-asset-bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps/game-lite/assets/production/process-tanks.glb \
                  apps/game-lite/assets/production/process-tanks-mobile.glb
          if git diff --cached --quiet; then
            echo "Generated assets are unchanged."
            exit 0
          fi
          git commit -m "Generate production process tank GLBs"
          git push origin "HEAD:${GITHUB_REF_NAME}"
