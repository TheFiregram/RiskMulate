<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RiskMulate Repo Preview Lab</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0a0d12;
      color: #eef2f7;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body { overflow: hidden; }

    .shell {
      display: grid;
      grid-template-columns: 320px 1fr;
      width: 100%;
      height: 100%;
      background: #0a0d12;
    }

    aside {
      display: flex;
      flex-direction: column;
      gap: 18px;
      padding: 22px;
      border-right: 1px solid #242b36;
      background: #10151d;
      overflow-y: auto;
    }

    .brand small {
      display: block;
      margin-bottom: 7px;
      color: #8c98aa;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .brand h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.15;
    }

    .brand p {
      margin: 9px 0 0;
      color: #9ba6b6;
      font-size: 13px;
      line-height: 1.5;
    }

    .repo-list {
      display: grid;
      gap: 10px;
    }

    .repo {
      width: 100%;
      padding: 14px;
      border: 1px solid #28313f;
      border-radius: 12px;
      background: #151b24;
      color: inherit;
      text-align: left;
      cursor: pointer;
      transition: border-color .15s ease, background .15s ease;
    }

    .repo:hover,
    .repo.active {
      border-color: #6b7b91;
      background: #1a2230;
    }

    .repo strong {
      display: block;
      font-size: 14px;
    }

    .repo span {
      display: block;
      margin-top: 5px;
      color: #8f9cad;
      font-size: 12px;
      line-height: 1.4;
    }

    .port {
      display: inline-block !important;
      margin-top: 9px !important;
      padding: 3px 7px;
      border-radius: 999px;
      background: #242d3b;
      color: #c8d0dc !important;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 10px !important;
    }

    main {
      display: grid;
      grid-template-rows: auto 1fr;
      min-width: 0;
      min-height: 0;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      min-height: 66px;
      padding: 12px 18px;
      border-bottom: 1px solid #242b36;
      background: #0f141c;
    }

    .current {
      min-width: 0;
    }

    .current strong,
    .current span {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .current strong { font-size: 14px; }
    .current span {
      margin-top: 3px;
      color: #8996a8;
      font-size: 11px;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex: 0 0 auto;
    }

    .action {
      padding: 9px 12px;
      border: 1px solid #303a49;
      border-radius: 9px;
      background: #171e28;
      color: #ecf1f7;
      font: inherit;
      font-size: 12px;
      text-decoration: none;
      cursor: pointer;
    }

    .action:hover { background: #202938; }

    .stage {
      position: relative;
      min-height: 0;
      background: #06080b;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
    }

    .empty {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 30px;
      color: #7f8b9c;
      text-align: center;
      pointer-events: none;
    }

    @media (max-width: 800px) {
      .shell { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
      aside {
        gap: 12px;
        padding: 12px;
        border-right: 0;
        border-bottom: 1px solid #242b36;
      }
      .brand p { display: none; }
      .repo-list {
        display: flex;
        gap: 8px;
        overflow-x: auto;
      }
      .repo { min-width: 180px; }
      .toolbar { min-height: 58px; padding: 9px 12px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside>
      <div class="brand">
        <small>RiskMulate</small>
        <h1>Repo Preview Lab</h1>
        <p>Switch between reference projects without mixing their dependencies with the main RiskMulate app.</p>
      </div>
      <div id="repoList" class="repo-list"></div>
    </aside>

    <main>
      <div class="toolbar">
        <div class="current">
          <strong id="currentName">Select a project</strong>
          <span id="currentUrl">No preview loaded</span>
        </div>
        <div class="actions">
          <a id="githubLink" class="action" href="https://github.com" target="_blank" rel="noreferrer">GitHub</a>
          <a id="openLink" class="action" href="#" target="_blank" rel="noreferrer">Open tab</a>
        </div>
      </div>
      <div class="stage">
        <div id="empty" class="empty">Choose a project from the left.</div>
        <iframe id="preview" title="Repository preview"></iframe>
      </div>
    </main>
  </div>

  <script>
    const repos = [
      {
        id: 'factory',
        name: 'Smart Factory Digital Twin',
        description: 'Three.js factory, equipment states, AGVs and interaction.',
        port: 4101,
        github: 'https://github.com/wenxingjun/threejs-factory-demo'
      },
      {
        id: 'fps',
        name: 'Three FPS',
        description: 'First-person controller, collision, physics and NPC systems.',
        port: 4102,
        github: 'https://github.com/mohsenheydari/three-fps'
      },
      {
        id: 'twin',
        name: 'Warehouse Digital Twin',
        description: 'Small Three.js industrial scene with device interaction.',
        port: 4103,
        github: 'https://github.com/KelvinW918/digital-twin-threejs'
      },
      {
        id: 'apex',
        name: 'APEX Hazard Training',
        description: 'Web training simulations with safety scenarios and scoring.',
        port: 4104,
        github: 'https://github.com/Kyzerer/APEX-HAZARD-VR-TRAINING'
      }
    ];

    const repoList = document.getElementById('repoList');
    const preview = document.getElementById('preview');
    const empty = document.getElementById('empty');
    const currentName = document.getElementById('currentName');
    const currentUrl = document.getElementById('currentUrl');
    const githubLink = document.getElementById('githubLink');
    const openLink = document.getElementById('openLink');

    function previewUrl(port) {
      const hostname = window.location.hostname;
      const protocol = window.location.protocol;

      if (hostname.endsWith('.app.github.dev')) {
        const codespaceHost = hostname.replace(/-\d+\.app\.github\.dev$/, `-${port}.app.github.dev`);
        return `${protocol}//${codespaceHost}`;
      }

      return `${protocol}//${hostname}:${port}`;
    }

    function selectRepo(repo) {
      const url = previewUrl(repo.port);
      document.querySelectorAll('.repo').forEach((button) => {
        button.classList.toggle('active', button.dataset.repo === repo.id);
      });

      currentName.textContent = repo.name;
      currentUrl.textContent = url;
      githubLink.href = repo.github;
      openLink.href = url;
      empty.style.display = 'none';
      preview.src = url;
      document.title = `${repo.name} · RiskMulate Preview Lab`;
    }

    repos.forEach((repo) => {
      const button = document.createElement('button');
      button.className = 'repo';
      button.type = 'button';
      button.dataset.repo = repo.id;
      button.innerHTML = `
        <strong>${repo.name}</strong>
        <span>${repo.description}</span>
        <span class="port">:${repo.port}</span>
      `;
      button.addEventListener('click', () => selectRepo(repo));
      repoList.appendChild(button);
    });

    selectRepo(repos[0]);
  </script>
</body>
</html>
