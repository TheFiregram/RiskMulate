[workspace]
resolver = "3"
members = [
  "apps/studio/src-tauri",
  "crates/ai-engine",
  "crates/analytics-engine",
  "crates/asset-engine",
  "crates/event-engine",
  "crates/plugin-manager",
  "crates/replay-engine",
  "crates/reporting-engine",
  "crates/rule-engine",
  "crates/simulation-engine",
  "crates/studio-core",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
